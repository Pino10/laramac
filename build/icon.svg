<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1660"/><stop offset="0.55" stop-color="#160d38"/><stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/><stop offset="0.7" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.95" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99f6e4"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#g1)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#g2)"/>
  <rect x="65" y="65" width="894" height="894" rx="207" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- three stacked layers: your stack -->
  <g transform="translate(512 560)">
    <path d="M0 150 L250 25 L0 -100 L-250 25 Z" fill="#14b8a6" opacity="0.45" filter="url(#soft)"/>
    <path d="M0 150 L250 25 L0 -100 L-250 25 Z" transform="translate(0 0)" fill="url(#layer3)"/>
    <path d="M0 60 L250 -65 L0 -190 L-250 -65 Z" fill="url(#layer2)"/>
    <path d="M0 60 L250 -65 L0 -190 L-250 -65 Z" fill="url(#glass)" opacity="0.35"/>
    <path d="M0 -30 L250 -155 L0 -280 L-250 -155 Z" fill="url(#layer1)"/>
    <path d="M0 -30 L250 -155 L0 -280 L-250 -155 Z" fill="url(#glass)" opacity="0.5"/>
    <path d="M0 -30 L250 -155 L0 -280 L-250 -155 Z" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="5" stroke-linejoin="round"/>
    <!-- the spark: it runs -->
    <circle cx="0" cy="-155" r="34" fill="#ffffff"/>
    <circle cx="0" cy="-155" r="70" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
  </g>
</svg>
