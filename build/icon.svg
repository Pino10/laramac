<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1950"/>
      <stop offset="1" stop-color="#0b0716"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#b16cff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.95" cy="0.1" r="0.45">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ddff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#base)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowC)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowB)"/>
    <!-- shadows under the panes -->
    <rect x="272" y="652" width="520" height="140" rx="40" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <rect x="242" y="490" width="520" height="140" rx="40" fill="#000" opacity="0.3" filter="url(#soft)"/>
    <!-- three glass panes: web server, languages, databases -->
    <rect x="272" y="632" width="520" height="140" rx="40" fill="url(#pane)" stroke="url(#edge)" stroke-width="5"/>
    <rect x="242" y="470" width="520" height="140" rx="40" fill="url(#pane)" stroke="url(#edge)" stroke-width="5"/>
    <rect x="212" y="308" width="520" height="140" rx="40" fill="url(#pane)" stroke="url(#edge)" stroke-width="5"/>
    <rect x="232" y="318" width="480" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <!-- the L -->
    <path d="M272 336 h52 v62 h80 l-18 34 H272 z" fill="url(#mark)"/>
    <!-- running lights -->
    <g>
      <circle cx="676" cy="378" r="15" fill="#4ade80" filter="url(#dotglow)" opacity="0.9"/>
      <circle cx="676" cy="378" r="12" fill="#86efac"/>
      <circle cx="632" cy="378" r="12" fill="#ffffff" opacity="0.45"/>
      <circle cx="706" cy="540" r="15" fill="#4ade80" filter="url(#dotglow)" opacity="0.9"/>
      <circle cx="706" cy="540" r="12" fill="#86efac"/>
      <circle cx="736" cy="702" r="15" fill="#4ade80" filter="url(#dotglow)" opacity="0.9"/>
      <circle cx="736" cy="702" r="12" fill="#86efac"/>
      <rect x="296" y="531" width="200" height="18" rx="9" fill="#ffffff" opacity="0.28"/>
      <rect x="326" y="693" width="160" height="18" rx="9" fill="#ffffff" opacity="0.22"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
</svg>
