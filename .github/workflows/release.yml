name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Create this release tag (for example v0.5.1). Leave empty to only build.'
        required: false
        default: ''
      also_here:
        description: 'Also publish in this repository, for copies of Laramac that still look here for updates.'
        type: boolean
        default: false

# Finished builds are published to a separate public repository (vars.RELEASES_REPO, using the
# RELEASES_TOKEN secret), so this repository can stay private. Without them, they go here as before.
# Set the repository variable MAC_RUNNER to "self-hosted" to build on your own Mac instead of
# GitHub's machines (free and unlimited, even for private repositories).

jobs:
  build-mac:
    runs-on: ${{ vars.MAC_RUNNER == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # No Apple Developer account: the app is ad-hoc signed (see scripts/adhoc-sign.cjs).
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the signature and that the app starts
        run: |
          APP="dist/mac-arm64/Laramac.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Launch the real app and make sure it is still running after 20 seconds.
          "$APP/Contents/MacOS/Laramac" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then
            echo "Laramac exited during startup:"; cat app.log; exit 1
          fi
          kill $PID || true
          echo "Laramac started and stayed running."
          cat app.log

      # The in-app updater only installs a DMG whose hash matches this list.
      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: laramac-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      # A release created in the GitHub UI (tag push): just attach the files.
      - name: Attach DMGs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      # Started from the Actions tab with a tag: publish the release.
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ vars.RELEASES_REPO || github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          target=""
          [ "$REPO" = "$GITHUB_REPOSITORY" ] && target="--target $GITHUB_SHA"
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --repo "$REPO" $target \
            --title "Laramac $TAG" --notes-file RELEASE_NOTES.md --prerelease
          echo "Published $TAG to $REPO"

      - name: Also publish in this repository
        if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.also_here && vars.RELEASES_REPO != '' && vars.RELEASES_REPO != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Laramac $TAG" --notes-file RELEASE_NOTES.md --prerelease
