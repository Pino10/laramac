name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Create this release tag (for example v0.5.1). Leave empty to only build.'
        required: false
        default: ''

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # No Apple Developer account: the app is ad-hoc signed (see scripts/adhoc-sign.cjs).
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the signature and that the app starts
        run: |
          APP="dist/mac-arm64/Laramac.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Launch the real app and make sure it is still running after 20 seconds.
          "$APP/Contents/MacOS/Laramac" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then
            echo "Laramac exited during startup:"; cat app.log; exit 1
          fi
          kill $PID || true
          echo "Laramac started and stayed running."
          cat app.log

      - uses: actions/upload-artifact@v4
        with:
          name: laramac-dmg
          path: dist/*.dmg

      # A release created in the GitHub UI (tag push): just attach the files.
      - name: Attach DMGs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

      # Started from the Actions tab with a tag: create the tag and the release.
      - name: Create the release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Laramac ${{ inputs.tag }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: dist/*.dmg
