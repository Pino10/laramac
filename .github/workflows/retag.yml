name: Move release tags (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retag.yml']
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          set -e
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.22.0" -f sha=7cb3030f3c38c33817121ccccf135ac5a9c81156 -F force=true > /dev/null && echo moved v0.22.0
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.23.0" -f sha=599b1afebfc7c4840badbb46e419269bcaebb8aa -F force=true > /dev/null && echo moved v0.23.0
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.23.1" -f sha=53b44a1c554d75eaba84947bafadd63adb904791 -F force=true > /dev/null && echo moved v0.23.1
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.23.2" -f sha=175a0abb1bdbae7a68cb51cf63e00f87ca9ea76e -F force=true > /dev/null && echo moved v0.23.2
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/move-tags" || true
