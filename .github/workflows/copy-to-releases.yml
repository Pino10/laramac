name: Copy downloads to the releases repository

# One-time move: copies the PHP builds (and, optionally, an app release) from this repository
# to the public releases repository, so this one can be made private.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Releases to copy, separated by spaces'
        default: 'php-builds'

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy
        env:
          FROM_TOKEN: ${{ github.token }}
          TO_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TO: ${{ vars.RELEASES_REPO }}
          TAGS: ${{ inputs.tags }}
        run: |
          [ -n "$TO" ] && [ -n "$TO_TOKEN" ] || { echo "Set the RELEASES_REPO variable and the RELEASES_TOKEN secret first."; exit 1; }
          for tag in $TAGS; do
            dir="assets-$tag"; mkdir -p "$dir"
            GH_TOKEN="$FROM_TOKEN" gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir"
            title=$(GH_TOKEN="$FROM_TOKEN" gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
            GH_TOKEN="$FROM_TOKEN" gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$dir.notes"
            if ! GH_TOKEN="$TO_TOKEN" gh release view "$tag" --repo "$TO" >/dev/null 2>&1; then
              latest=$([ "$tag" = php-builds ] && echo "--latest=false" || echo "")
              GH_TOKEN="$TO_TOKEN" gh release create "$tag" --repo "$TO" --prerelease $latest --title "$title" --notes-file "$dir.notes"
            fi
            GH_TOKEN="$TO_TOKEN" gh release upload "$tag" --repo "$TO" --clobber "$dir"/*
            echo "Copied $tag: $(ls "$dir" | wc -l) files"
          done
