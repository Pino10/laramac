<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2133"/><stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/><stop offset="0.7" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.6"/><stop offset="0.75" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.1" y1="0.15" x2="0.9" y2="0.85">
