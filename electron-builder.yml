appId: dev.laramac.app
productName: Laramac
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/electron-liquid-glass/**/*
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # No Apple Developer account: electron-builder's own signing is skipped and
  # scripts/adhoc-sign.cjs gives the app an ad-hoc signature instead, which Apple
  # Silicon requires before it will run anything.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
afterSign: scripts/adhoc-sign.cjs
dmg:
  title: Laramac ${version}
  artifactName: Laramac-${version}-${arch}.dmg
npmRebuild: false
# Electron's built-in security switches: the app cannot be run as a plain Node.js
# process, and Node debugging flags and NODE_OPTIONS are ignored.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
