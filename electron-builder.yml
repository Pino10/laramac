appId: dev.laramac.app
productName: Laramac
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/electron-liquid-glass/**/*
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Unsigned build: no Apple Developer account required.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Laramac ${version}
  artifactName: Laramac-${version}-${arch}.dmg
npmRebuild: false
